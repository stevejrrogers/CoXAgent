# FULL CoXAgent production deploy — the 4-service split, one container per
# role, matching the Helm chart's shape. Use this over docker-compose.yml when
# you want independent scaling/restarts per plane on a single Docker host.
#
#   caddy (HTTPS) ─┬─ /…/ws /…/events /…/terminal /…/docs-ws → realtime
#                  └─ everything else                         → gateway
#   runner   — the agent worker (cycles). Needs an agent CLI (claude/opencode)
#              + its credentials, so by default it runs NATIVELY on operator
#              machines, not here. Enable the container only if your image
#              bundles a CLI:  docker compose --profile runner up -d
#   knowledge — codegraph indexing; internal only.
#
# Same .env as docker-compose.yml. Run:
#   docker compose -f docker-compose.split.yml up -d
name: coxagent

x-app-env: &app-env
  COXAGENT_HOST: 0.0.0.0
  COXAGENT_REGISTRY: /root/CoXAgent/registry.json
  COXAGENT_ADMIN_USER: ${ADMIN_USER:?superuser login must be set}
  COXAGENT_ADMIN_PASSWORD: ${COXAGENT_ADMIN_PASSWORD:?a strong super-admin secret must be set}
  COXAGENT_S3_ENDPOINT: http://minio:9000
  COXAGENT_S3_BUCKET: coxagent
  COXAGENT_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?MinIO access-key must be set}
  COXAGENT_S3_SECRET_KEY: ${S3_SECRET_KEY:?MinIO credential must be set}
  COXAGENT_MONGO_URL: mongodb://${MONGO_USER:?MongoDB root user must be set}:${MONGO_PASSWORD:?MongoDB root secret must be set}@mongo:27017/?authSource=admin
  COXAGENT_MONGO_DB: coxagent
  COXAGENT_DB_DSN: postgres://${PG_USER:?Postgres role must be set}:${PG_PASSWORD:?Postgres superuser secret must be set}@db:5432/coxagent
  # Shared account/session store — REQUIRED for the split: gateway issues the
  # login cookie, realtime must validate it. Without this each container keeps
  # file-backed sessions in its own memory and cross-service auth (e.g. the
  # /events SSE stream on realtime) answers 401. Sessions ride Redis (native
  # TTL) on top of this.
  COXAGENT_AUTH_DSN: postgres://${PG_USER:?Postgres role must be set}:${PG_PASSWORD:?Postgres superuser secret must be set}@db:5432/coxagent
  COXAGENT_REDIS_URL: redis://:${REDIS_PASSWORD:?must carry a value; blank means an unauthenticated session store}@redis:6379
  COXAGENT_TURN_URL: turn:${PUBLIC_IP}:3478
  COXAGENT_TURN_SECRET: ${TURN_SECRET:?coturn shared-secret must be set}

services:
  # Every data store below publishes to 127.0.0.1 ONLY. A bare "5432:5432" binds
  # 0.0.0.0, which put Postgres, Redis, Mongo and MinIO on the LAN — with Redis
  # holding live session tokens and no password at all, anyone on the same WiFi
  # could read a token and sign in as super-admin. Nothing outside this host
  # needs these ports: the services reach each other over the compose network by
  # name, and the locally-run operator reaches them over the loopback binding.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?MinIO access-key must be set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?MinIO credential must be set}
    volumes:
      - minio:/data
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MongoDB root user must be set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MongoDB root secret must be set}
    volumes:
      - mongo:/data/db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      # Host port 5433, not 5432: this machine already runs a native Postgres on
      # 5432. While this container published 0.0.0.0:5432 the two coexisted, so a
      # local operator dialling 127.0.0.1:5432 silently reached the WRONG server.
      # Containers are unaffected — they resolve `db:5432` on the compose network.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${PG_USER:?Postgres role must be set}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Postgres superuser secret must be set}
      POSTGRES_DB: coxagent
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:?Postgres role must be set}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    # Sessions live here (native TTL), so an unauthenticated Redis IS an
    # authentication bypass — a stolen `cox:auth:session:*` value is a signed-in
    # super-admin. It ran with no password until 2026-08-04.
    command:
      ["redis-server", "--save", "", "--appendonly", "no",
       "--requirepass", "${REDIS_PASSWORD:?must carry a value; blank means an unauthenticated session store}"]
    restart: unless-stopped

  coturn:
    image: coturn/coturn
    network_mode: host
    command:
      - -n
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?coturn shared-secret must be set}
      - --realm=coxagent
      - --no-tls
      - --no-dtls
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${PUBLIC_IP}
    restart: unless-stopped

  # Control plane: REST + MCP + authz + audit. Stateless — scale with
  # `docker compose up -d --scale gateway=3` behind Caddy.
  gateway:
    build: { context: .., dockerfile: deploy/Dockerfile }
    entrypoint: ["/usr/local/bin/cox-gateway"]
    command: []
    environment: *app-env
    volumes:
      - appdata:/data
      - ./volume/CoXAgent:/root/CoXAgent
    depends_on: [minio, mongo, db, redis]
    restart: unless-stopped

  # Socket plane: chat/collab/terminal WebSockets + SSE.
  realtime:
    build: { context: .., dockerfile: deploy/Dockerfile }
    entrypoint: ["/usr/local/bin/cox-realtime"]
    command: []
    environment: *app-env
    volumes:
      - appdata:/data
      - ./volume/CoXAgent:/root/CoXAgent
    depends_on: [db, redis]
    restart: unless-stopped

  # Knowledge plane: codegraph indexing / REPO_MAP. Internal only (health-only
  # HTTP surface, enforced in-process by COXAGENT_ROLE).
  knowledge:
    build: { context: .., dockerfile: deploy/Dockerfile }
    entrypoint: ["/usr/local/bin/cox-knowledge"]
    command: []
    environment: *app-env
    volumes:
      - appdata:/data
      - ./volume/CoXAgent:/root/CoXAgent
    depends_on: [db, redis]
    restart: unless-stopped

  # Agent worker. DISABLED by default: agent CLIs (claude/opencode) and their
  # logins live on operator machines; run `cox-runner` natively there instead.
  # Only enable this if your image bundles a CLI + credentials.
  runner:
    build: { context: .., dockerfile: deploy/Dockerfile }
    entrypoint: ["/usr/local/bin/cox-runner"]
    command: []
    profiles: ["runner"]
    environment:
      <<: *app-env
      COXAGENT_STATE_DIR: /data/state
      COXAGENT_WORK_DIR: /work
      COXAGENT_OPERATOR: ${RUNNER_OPERATOR:-runner@compose}
    volumes:
      - appdata:/data
      - ./volume/CoXAgent:/root/CoXAgent
      - runner_work:/work
    depends_on: [db, redis]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile.split:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gateway, realtime]
    restart: unless-stopped

volumes:
  minio:
  mongo:
  db:
  appdata:
  runner_work:
  caddy_data:
  caddy_config:
