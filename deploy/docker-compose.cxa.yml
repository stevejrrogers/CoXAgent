# Standalone CXA backend — Postgres + Redis for the native CXA hub on this host.
#
# WHY this exists: the root docker-compose.yml (web app on 8101) and the split
# deploy both name their service "db"/project "coxagent", so they collide.
# CXA's data lives in the named volume `coxagent_db`; running under its own
# project (`cxa-backend`) and mounting that volume directly keeps it separate
# from the web app's `coxagent_pgdata`.
#
# The native hub reads ~/CoXAgent/coordination.json which points at
# 127.0.0.1:5433 (Postgres) + 127.0.0.1:6379 (Redis).
#
# Bring up with every var below set — all three are REQUIRED and fail fast if
# unset, matching deploy/local-infra/docker-compose.yml (CXA-B016): a missing
# value aborts `up` instead of booting Postgres/Redis with blank credentials.
#
#   cp deploy/.env.example .env    # or reuse an existing filled-in deploy/.env
#   source .env                    # exports PG_USER/PG_PASSWORD/REDIS_PASSWORD …
#   docker compose -f deploy/docker-compose.cxa.yml up -d --remove-orphans
name: cxa-backend

services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${PG_USER:?PG_USER is required — copy .env.example to .env and fill it in}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required — copy .env.example to .env and fill it in}
      POSTGRES_DB: coxagent
    volumes:
      - source_cxa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command:
      ["redis-server", "--save", "", "--appendonly", "no",
       "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required — copy .env.example to .env and fill it in}"]
    restart: unless-stopped

volumes:
  # Mount CXA's existing Postgres data directly — do NOT create a new empty one.
  source_cxa_data:
    external:
      name: coxagent_db
