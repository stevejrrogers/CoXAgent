# Self-host CoXAgent: the hub + dashboard, backed by Postgres for multi-tenant
# state, audit, and audit retention. Bring up with:
#   COXAGENT_ADMIN_PASSWORD=yourpw docker compose up -d --build
# then open http://localhost:8101 and log in as root.
#
# Host port is fixed at 8101 (this project's assigned deploy.host_port) so it
# never collides with a live hub bound to 4000 on the same docker host.
#
# Note: real LLM agents need a CLI (claude/opencode) on PATH inside the
# container; the base image ships scripted/mock (offline). Install a CLI in a
# derived image, or run the loop where the CLI lives.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-coxagent_dev}
      POSTGRES_DB: coxagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 15

  coxagent:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      COXAGENT_DB_DSN: postgres://postgres:${PG_PASSWORD:-coxagent_dev}@db:5432/coxagent
      COXAGENT_ADMIN_USER: root
      COXAGENT_ADMIN_PASSWORD: ${COXAGENT_ADMIN_PASSWORD:-changeme}
      COXAGENT_AUDIT_RETENTION_DAYS: "90"
    ports:
      - "8101:4000"
    volumes:
      - workspace:/workspace

volumes:
  pgdata:
  workspace:
