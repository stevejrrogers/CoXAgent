name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p coxagent-app
      - name: Package
        run: tar czf coxagent-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release coxagent
      - uses: softprops/action-gh-release@v2
        with:
          files: coxagent-${{ matrix.target }}.tar.gz
          generate_release_notes: true
