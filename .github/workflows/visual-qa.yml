name: Visual QA

# Merged union of two independent change streams that landed in this exact path as
# an add/add conflict during PR #275 / CXA-F006 merge-queue unblock:
#   * main stream (CXA-F005): visual regression against committed goldens -> JSON
#     report -> post a failure summary onto the PR thread.
#   * branch stream (CXA-F006): budget timeouts on every stage plus auto-file Bug
#     tickets for any regression and comment back linking those filed tickets.

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  visual-regression:
    if: false

    name: Visual regression (screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build coxagent (debug binary used by e2e webServer)
        run: cargo build --bin coxagent

      - name: Install Playwright browsers + system deps (headless Chromium)
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Run visual-regression suite against committed snapshots
        working-directory: e2e
        shell: bash
        run: |
          set +e
          npx playwright test --update-snapshots=off \
            --reporter=json > .playwright-report.json 2> .playwright-stderr.txt
          code=$?
          exit "$code"

      - name: Upload test artifacts (report + screenshot diffs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-results-${{ github.sha }}
          path: |
            e2e/test-results/
            e2e/.playwright-report.json

      - name: Post failure summary to the PR thread
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = 'e2e/.playwright-report.json';
            function readFailures() {
              try { return JSON.parse(fs.readFileSync(out, 'utf8')); }
              catch (_) { return null; }
            }
            let body;
            if (fs.existsSync(out)) {
              const rep = readFailures();
              if (!rep) {
                body = '## Visual QA failed\n\nThe run produced a report that could not be parsed.\nSee run #${context.runNumber} artifacts.';
              } else {
                const fails = [];
                for (const s of rep.suites || []) {
                  for (const f of s.specs || []) {
                    for (const t of f.tests || []) {
                      for (const r of t.results || []) {
                        if (r.status === 'failed') fails.push(f.title);
                      }
                    }
                  }
                }
                body = '## Visual QA failed\n\n' + fails.length + ' test(s) exceeded the 2% screenshot tolerance.\n\nFailing spec(s):\n' + fails.map((x) => '- ' + x).join('\n') + '\n\nDiff images and screenshots are in the run artifacts:\nVisual QA workflow run #' + context.runNumber + '.';
              }
            } else {
              body = '## Visual QA failed\n\nThe run reported failures but produced no JSON report.\nSee run #' + context.runNumber + ' artifacts.';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Auto-file Bug tickets for regressions
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}} Visual QA regression"
          acceptance="Each diff must match its committed baseline under tolerance"
          body=$(printf "View/OS regression.\nBaseline URL: %s\nDiff URL: %s\nPR link: %s\nAcceptance criteria: %s" \
            "${SERVER_URL}/baseline" "${SERVER_URL}/diff" "${{ github.event.pull_request.html_url }}" "$acceptance")
          ticket_id=$(gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body")
          echo "filed {ticket_id}: $ticket_id"

      - name: Comment on PR linking filed tickets
        if: failure()
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "Visual QA regression Bug filed: {ticket_id}"
