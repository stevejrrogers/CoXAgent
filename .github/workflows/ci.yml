name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (pedantic, deny warnings)
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo test --all-features

  deploy-build:
    # COX-B006 regression guard: reproduce the Docker builder's compile — the
    # release binary for Linux, no `test` cfg — which is what turned an ungated
    # macOS-only helper into `error: function ... is never used` under the
    # workspace's `warnings = "deny"`, so no image could ever be built.
    # Deliberately separate from `check`: this job runs plain rustc lints only,
    # so it stays a trustworthy deploy gate while the clippy pedantic baseline
    # in `crates/application` keeps `check` red.
    name: release build (linux, as the Docker builder sees it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the deploy binary
        run: cargo build --release --bin coxagent

  deploy-smoke:
    # COX-B008 regression guard for the OTHER half of the bug report: a green
    # `cargo build` is not a running app. This job runs the exact command this
    # repo's docker-compose.yml documents, then proves the hub actually answers
    # on the published host port — so "compiles" can never again be mistaken
    # for "comes up". Catches image build breakage, entrypoint/migration
    # failures and port-binding mistakes in one step.
    name: docker compose smoke (app answers on 8101)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: COXAGENT_ADMIN_PASSWORD=ci-smoke docker compose up -d --build
      - name: Wait for the hub to answer on the published port
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8101/ || true)
            if [ "$code" = "200" ]; then
              echo "hub answered 200 on 8101 after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "hub never answered 200 on host port 8101 (last code: ${code:-none})"
          exit 1
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
