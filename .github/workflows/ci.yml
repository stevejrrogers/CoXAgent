name: CI

# Cost discipline (2026-09): CI runs ONCE per change — on the merge to main —
# not on every PR push. Every merge is already verified locally (clippy, full
# test suite, Playwright) by the SA review lane before it lands; the Actions
# run on main is the independent record, and workflow_dispatch covers ad-hoc
# runs. This halves billed minutes without weakening the merge bar.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # CXA-B079 re-enabled deploy-smoke; CXA-C016 re-enables `check` and
  # `deploy-build` now that the debt that kept them red is paid (fmt drift
  # fixed, clippy pedantic baseline at zero, unit suite green). 0387409f had
  # disabled every job while the repo was private (GitHub-hosted runs blocked
  # without a paid plan). ci_availability_gate.rs fails if any job is re-gated.
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (pedantic, deny warnings)
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo test --all-features

  deploy-build:
    # COX-B006 regression guard: reproduce the Docker builder's compile — the
    # release binary for Linux, no `test` cfg — which is what turned an ungated
    # macOS-only helper into `error: function ... is never used` under the
    # workspace's `warnings = "deny"`, so no image could ever be built.
    # Deliberately separate from `check`: this job runs plain rustc lints only,
    # so it stays a trustworthy deploy gate while the clippy pedantic baseline
    # in `crates/application` kept `check` red when the jobs were split.
    name: release build (linux, as the Docker builder sees it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the deploy binary
        run: cargo build --release --bin coxagent

  deploy-smoke:
    # COX-B008 regression guard for the OTHER half of the bug report: a green
    # `cargo build` is not a running app. The test brings the stack up with the
    # exact command this repo's docker-compose.yml documents and proves the hub
    # answers on the published host port — so "compiles" can never again be
    # mistaken for "comes up". Catches image build breakage, entrypoint
    # failures and port-binding mistakes in one step. Test rather than shell so
    # a developer can run the same gate locally.
    name: docker compose smoke (app answers on 8101)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bring the stack up and probe the published port
        run: cargo test -p coxagent-app --test deploy_smoke -- --ignored --nocapture
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  # CXA-F286: merge-blocking is enactable from repo state alone —
  # branch protection on main must require BOTH gate jobs as required status
  # checks, matched by their check-run display names exactly —
  #   - docker compose smoke (app answers on 8101)  (the availability gate)
  #   - ownership + CI wiring guards                (this job)
  # ci_availability_gate.rs fails if a name drifts or this documentation
  # disappears, so a rename can never silently dangle a required check.
  #
  # Docker-free by construction: every test here is a pure decision over
  # names, labels and workflow text — no compose stack, no daemon — so a
  # docker-less runner can never silently skip the guard.
  guard-tests:
    name: ownership + CI wiring guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Reclaimable teardown policy (protected infra stays protected)
        run: cargo test -p coxagent-infrastructure --lib reclaimable
      - name: CI wiring guards (jobs exist, ungated, real commands)
        run: cargo test -p coxagent-app --test deploy_smoke --test ci_availability_gate --test test_env_guard_f326_gate
      - name: Hexagonal gate (CXA-B211 — application layer does no direct IO)
        run: cargo test -p coxagent-app --test hexagonal_gate -- --nocapture

  # CXA-F326: the DSN-gated Postgres/Redis integration tests are #[ignore]d —
  # this job is the only sanctioned way to run them. It brings its own
  # ephemeral service containers (lifecycle-bound to the job, never a deployed
  # hub), names the database `cxa_test` exactly as the shared guard demands,
  # and exports both env vars explicitly (nothing inherited). The guard in
  # crates/infrastructure/tests/common/mod.rs still refuses a live hub and
  # fails closed on any probe error — this job proves the suites keep passing
  # against the ephemeral shape they will always be given. Ordinary CI without
  # a database (the `check` job) skips them explicitly and stays green.
  integration:
    name: integration (ephemeral cxa_test postgres + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cxa_test
          POSTGRES_USER: cox
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cox -d cxa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COXAGENT_TEST_PG_DSN: postgres://cox:test@localhost:5432/cxa_test
      COXAGENT_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the DSN-gated integration tests
        run: cargo test -p coxagent-infrastructure --test sql_store_contract --test kv_doc_contract --test sql_auth_token_harvest --test distributed_coord -- --ignored
