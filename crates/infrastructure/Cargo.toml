[package]
name = "coxagent-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# harxes-core is a PRIVATE SSH git dependency (Harxes.git). Gating it behind a
# default-on feature keeps the live build unchanged while letting an external
# operator build without deploy-key access via `--no-default-features`:
#   cargo build -p coxagent-infrastructure --no-default-features
# compiles the whole crate with the embedded Harxes engine adapter cfg'd out.
default = ["harxes"]
harxes = ["dep:harxes-core"]

[dependencies]
harxes-core = { git = "ssh://git@github.com/stevejrrogers/Harxes.git", tag = "v0.4.8", optional = true }
coxagent-domain.workspace = true
coxagent-application.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
time.workspace = true
fs4.workspace = true
tracing.workspace = true
argon2.workspace = true
rand.workspace = true
sha2.workspace = true
hmac.workspace = true
sha1.workspace = true
reqwest.workspace = true
tokio-postgres.workspace = true
deadpool-postgres.workspace = true
percent-encoding.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
tokio-postgres-rustls.workspace = true
webpki-roots.workspace = true
redis.workspace = true
mongodb.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-postgres.workspace = true

[lints]
workspace = true
