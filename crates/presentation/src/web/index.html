<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CoXAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0F; --panel:#101017; --card:#15151D; --card2:#1B1B24; --hover:#20202B;
    --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
    --text:#F1F2F6; --muted:#9A9DAB; --dim:#5E616C;
    --accent:#7C6CFF; --accent2:#9A8CFF; --accentbg:rgba(124,108,255,.14);
    --green:#4ADE80; --amber:#FBBF24; --red:#F87171; --blue:#60A5FA; --teal:#2DD4BF; --purple:#A78BFA;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,system-ui,sans-serif;
    font-size:14px;display:flex;-webkit-font-smoothing:antialiased}
  .ti{font-size:18px;line-height:1;vertical-align:-2px}
  /* sidebar */
  .side{width:246px;flex-shrink:0;height:100vh;position:sticky;top:0;background:var(--panel);
    border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 16px;gap:6px}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 6px 14px}
  .brand .mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#5B4BE0);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px}
  .brand .nm{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .brand .tg{font-size:11px;color:var(--dim)}
  .proj{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;margin-bottom:6px}
  .proj .pn{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
  .proj .al{background:var(--accentbg);color:var(--accent2);font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px}
  .proj .pv{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:10px}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--muted);
    text-decoration:none;font-size:13px;font-weight:500;cursor:pointer}
  .nav a:hover{background:var(--card);color:var(--text)}
  .nav a.on{background:var(--accentbg);color:var(--accent2)}
  .runner{margin-top:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px}
  .runner .rt{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-bottom:3px}
  .runner .rc{font-size:11px;color:var(--muted);margin-bottom:11px}
  .ctlrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .ctlrow button{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:9px;
    padding:8px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:inherit}
  .ctlrow button:hover{background:var(--hover);border-color:var(--border2)}
  .ctlrow button.pri{grid-column:1/3;background:var(--accent);border-color:transparent;color:#fff}
  .ctlrow button.pri:hover{background:var(--accent2)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0}
  .dot.live{background:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.18);animation:pulse 1.8s infinite}
  .dot.paused{background:var(--amber)} .dot.off{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  /* main */
  .main{flex:1;min-width:0;height:100vh;overflow:auto}
  .topbar{position:sticky;top:0;z-index:4;background:rgba(10,10,15,.8);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);padding:15px 26px;display:flex;align-items:center;gap:12px}
  .topbar h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
  .topbar .sp{flex:1}
  .chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);
    border-radius:20px;padding:6px 12px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--text);font-weight:600}
  .content{padding:24px 26px;max-width:1320px}
  .sec{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin:28px 0 13px}
  .sec:first-child{margin-top:6px}
  /* kpis */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:13px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 17px}
  .kpi .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--accentbg);color:var(--accent2);margin-bottom:11px}
  .kpi .v{font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .kpi .k{font-size:12px;color:var(--muted);margin-top:5px}
  /* agents */
  .agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
  .agent{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;display:flex;gap:11px;align-items:center}
  .av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;position:relative}
  .av .sr{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--card);background:var(--dim)}
  .agent.run .av .sr{background:var(--green);animation:pulse 1.6s infinite}
  .agent .rl{font-size:13px;font-weight:600}
  .agent .ds{font-size:11px;color:var(--dim);margin-top:1px}
  .agent.run .ds{color:var(--green)}
  /* layout */
  .grid{display:grid;grid-template-columns:1fr 322px;gap:22px;align-items:start}
  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}
  .col{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;min-height:90px}
  .col h3{margin:0 0 11px;font-size:12px;display:flex;align-items:center;gap:7px;font-weight:600}
  .col h3 .n{margin-left:auto;background:var(--card2);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--muted);font-weight:600}
  .card-t{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:border-color .12s}
  .card-t:hover{border-color:var(--border2)}
  .card-t .cid{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;letter-spacing:.02em}
  .card-t .ct{font-size:13px;margin:4px 0 8px;line-height:1.4}
  .badges{display:flex;gap:5px;flex-wrap:wrap}
  .b{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:600}
  .b.high{background:rgba(248,113,113,.16);color:#fca5a5} .b.medium{background:rgba(251,191,36,.16);color:#fcd34d}
  .b.low{background:rgba(154,157,171,.16);color:var(--muted)} .b.ui{background:rgba(167,139,250,.16);color:#c4b5fd}
  .b.bug{background:rgba(248,113,113,.16);color:#fca5a5}
  .empty{color:var(--dim);font-size:12px;text-align:center;padding:16px 0}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:18px}
  .panel h4{margin:0 0 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
  .act{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start}
  .act:last-child{border:none;padding-bottom:0}
  .act .ad{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
  .act .atx{flex:1;font-size:12px;line-height:1.5}
  .act .atx .who{font-weight:600} .act .atx .tk{color:var(--muted);font-family:ui-monospace,monospace;font-size:11px}
  .act .tm{color:var(--dim);font-size:10px;white-space:nowrap}
  .rel{display:flex;gap:11px;padding-bottom:13px}
  .rel:last-child{padding-bottom:0}
  .rel .rv{background:var(--accentbg);color:var(--accent2);font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;height:fit-content}
  .rel .rt{font-size:12px} .rel .rt .rd{color:var(--dim);font-size:11px;margin-top:2px}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(5,5,9,.62);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
  .ov.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border2);border-radius:18px;max-width:580px;width:100%;max-height:86vh;overflow:auto;padding:22px 24px}
  .modal h3{margin:0;font-size:19px;font-weight:600}
  .modal .x{float:right;cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .modal .x:hover{background:var(--card);color:var(--text)}
  .modal .msub{color:var(--muted);font-size:12px;margin:2px 0 16px}
  .mrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
  .mrow .lbl{color:var(--muted);min-width:118px}
  .modal pre{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px;overflow:auto;white-space:pre-wrap;line-height:1.55;font-family:ui-monospace,monospace}
  .modal select,.modal input{background:var(--card);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:7px 9px;font-size:12px;font-family:inherit}
  .modal select:focus,.modal input:focus{outline:none;border-color:var(--accent)}
  .modal .save{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;margin-top:16px;font-family:inherit;font-size:13px}
  .modal .save:hover{background:var(--accent2)}
</style>
</head>
<body>
  <aside class="side">
    <div class="brand"><div class="mk"><i class="ti ti-hexagon-letter-c"></i></div>
      <div><div class="nm">CoXAgent</div><div class="tg">autonomous dev team</div></div></div>
    <div class="proj">
      <div class="pn"><i class="ti ti-folder" style="color:var(--muted)"></i><span id="pn-name">Project</span><span class="al" id="pn-alias">—</span></div>
      <div class="pv"><span><i class="ti ti-tag" style="font-size:13px"></i> v<b id="ver">0.0.0</b></span><span id="pn-tickets">0 tickets</span></div>
    </div>
    <nav class="nav">
      <a class="on" onclick="go('overview',this)"><i class="ti ti-layout-dashboard"></i> Overview</a>
      <a onclick="go('team',this)"><i class="ti ti-users"></i> Team</a>
      <a onclick="go('board',this)"><i class="ti ti-columns"></i> Board</a>
      <a onclick="go('activity',this)"><i class="ti ti-activity"></i> Activity</a>
      <a onclick="openSettings()"><i class="ti ti-settings"></i> Settings</a>
    </nav>
    <div class="runner">
      <div class="rt"><span class="dot off" id="runmode"></span><span id="runlbl">idle</span></div>
      <div class="rc" id="runsum">paused</div>
      <div class="ctlrow">
        <button class="pri" onclick="ctl('resume')"><i class="ti ti-player-play"></i> Resume</button>
        <button onclick="ctl('step')"><i class="ti ti-player-track-next"></i> Step</button>
        <button onclick="ctl('pause')"><i class="ti ti-player-pause"></i> Pause</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Control center</h1><div class="sp"></div>
      <div class="chip"><span class="dot off" id="conn"></span><span id="connlbl">connecting</span></div>
    </div>
    <div class="content">
      <div class="sec" id="overview">Overview</div><div class="kpis" id="kpis"></div>
      <div class="sec" id="team">Team</div><div class="agents" id="agents"></div>
      <div class="sec" id="board">Board</div>
      <div class="grid">
        <div>
          <div class="cols" id="features"></div>
          <div style="height:16px"></div><div class="cols" id="bugs"></div>
        </div>
        <div>
          <div class="panel"><h4><i class="ti ti-activity" style="color:var(--accent2)"></i> Activity</h4><div id="activity"></div></div>
          <div class="panel" id="activity-anchor"><h4><i class="ti ti-history" style="color:var(--accent2)"></i> Changelog</h4><div id="changelog"></div></div>
        </div>
      </div>
    </div>
  </main>

  <div class="ov" id="ov-ticket" onclick="if(event.target===this)close_('ov-ticket')"><div class="modal" id="ticket-body"></div></div>
  <div class="ov" id="ov-settings" onclick="if(event.target===this)close_('ov-settings')"><div class="modal" id="settings-body"></div></div>

<script>
const AGENTS=[["BA","proposes features","--blue"],["PO","owns priority","--amber"],["SM","runs the process","--teal"],
  ["SA","designs the how","--purple"],["PD","owns UX","--purple"],["DEV-BUG","fixes bugs","--red"],
  ["DEV-FEATURE","builds features","--green"],["TEST","verifies work","--teal"],["DOCS","writes guides","--blue"]];
const FCOLS=[["pending","Pending","--muted"],["ready","Ready","--blue"],["in_progress","In progress","--amber"],["done","Done","--green"],["documented","Documented","--teal"]];
const BCOLS=[["open","Open","--red"],["fixed","Fixed","--amber"],["verified","Verified","--green"]];
const ROLES=["ba","po","sm","sa","pd","dev_bug","dev_feature","test","docs"];
const KPI_IC={Shipped:"ti-rocket","In flight":"ti-plane-tilt","Open bugs":"ti-bug",Documented:"ti-book",Releases:"ti-versions"};
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const cvar=n=>getComputedStyle(document.documentElement).getPropertyValue(n)||"#888";
let TICKETS={};

function go(id,el){document.getElementById(id).scrollIntoView({behavior:"smooth",block:"start"});
  document.querySelectorAll(".nav a").forEach(a=>a.classList.remove("on"));if(el)el.classList.add("on");}
function initials(r){return r.replace("DEV-","").slice(0,2);}
function kpi(k,v){const ic=KPI_IC[k]||"ti-point";return `<div class="kpi"><div class="ic"><i class="ti ${ic}"></i></div><div class="v">${v}</div><div class="k">${k}</div></div>`;}
function metricsFrom(s){const t=s.tickets||[],h=s.history||[],isF=x=>x.type!=="bug";
  return {shipped:t.filter(x=>isF(x)&&(x.status==="done"||x.status==="documented")).length,
    inflight:t.filter(x=>isF(x)&&(x.status==="ready"||x.status==="in_progress")).length,
    openBugs:t.filter(x=>x.type==="bug"&&x.status==="open").length,
    docd:t.filter(x=>x.status==="documented").length,releases:h.length};}
function card(t){const a={high:"var(--red)",medium:"var(--amber)",low:"var(--dim)"}[t.priority]||"var(--dim)";
  const ui=t.has_ui?'<span class="b ui">UI</span>':'',bug=t.type==="bug"?'<span class="b bug">bug</span>':'';
  return `<div class="card-t" onclick="showTicket('${t.id}')"><div class="cid">${esc(t.id)}</div>
    <div class="ct">${esc(t.title)}</div><div class="badges"><span class="b ${t.priority}">${t.priority}</span>${ui}${bug}</div></div>`;}
function column([k,l,c],ts){const items=ts.filter(t=>t.status===k);
  return `<div class="col"><h3><span class="dot" style="background:var(${c})"></span>${l}<span class="n">${items.length}</span></h3>${items.length?items.map(card).join(""):'<div class="empty">—</div>'}</div>`;}
function render(s){
  TICKETS={};(s.tickets||[]).forEach(t=>TICKETS[t.id]=t);
  const m=metricsFrom(s);
  document.getElementById("ver").textContent=s.current_version;
  document.getElementById("pn-name").textContent=s.alias?s.alias+" project":"Project";
  document.getElementById("pn-alias").textContent=s.alias||"—";
  document.getElementById("pn-tickets").textContent=(s.tickets||[]).length+" tickets";
  document.getElementById("kpis").innerHTML=[kpi("Shipped",m.shipped),kpi("In flight",m.inflight),
    kpi("Open bugs",m.openBugs),kpi("Documented",m.docd),kpi("Releases",m.releases)].join("");
  const active=(s.tickets||[]).filter(t=>t.status==="in_progress");
  document.getElementById("agents").innerHTML=AGENTS.map(([r,d,c])=>{
    const run=active.length&&(r==="DEV-FEATURE"||r==="DEV-BUG");const col=cvar(c).trim();
    return `<div class="agent ${run?'run':''}"><div class="av" style="background:${col}22;color:${col}">${initials(r)}<span class="sr"></span></div>
      <div><div class="rl">${r}</div><div class="ds">${run?'working…':d}</div></div></div>`;}).join("");
  const feats=(s.tickets||[]).filter(t=>t.type!=="bug"),bugs=(s.tickets||[]).filter(t=>t.type==="bug");
  document.getElementById("features").innerHTML=FCOLS.map(c=>column(c,feats)).join("");
  document.getElementById("bugs").innerHTML=BCOLS.map(c=>column(c,bugs)).join("");
  const agentCol={BA:"--blue","DEV-FEATURE":"--green","DEV-BUG":"--red",SA:"--purple",TEST:"--teal",DOCS:"--blue"};
  const act=[...(s.activity||[])].reverse();
  document.getElementById("activity").innerHTML=act.length?act.map(a=>{const col=cvar(agentCol[a.agent]||"--muted").trim();
    return `<div class="act"><div class="ad" style="background:${col}22;color:${col}">${initials(a.agent)}</div>
    <div class="atx"><span class="who">${esc(a.agent)}</span> ${esc(a.action)} ${a.ticket?`<span class="tk">${esc(a.ticket)}</span>`:''}</div>
    <span class="tm">${esc((a.at||"").slice(11,16))}</span></div>`;}).join(""):'<div class="empty">no activity yet</div>';
  const h=s.history||[];
  document.getElementById("changelog").innerHTML=h.length?[...h].reverse().map(r=>`<div class="rel"><span class="rv">v${esc(r.version)}</span>
    <div class="rt">${esc(r.title)}<div class="rd">${esc((r.at||"").split("T")[0])} · ${esc(r.ticket)}</div></div></div>`).join(""):'<div class="empty">no releases yet</div>';
}
function showTicket(id){const t=TICKETS[id];if(!t)return;const d=t.design||{},tech=d.technical,ux=d.ux;
  let h=`<span class="x" onclick="close_('ov-ticket')"><i class="ti ti-x"></i></span><h3>${esc(t.title)}</h3>
    <div class="msub">${esc(t.id)} · ${esc(t.type)}</div>
    <div class="mrow"><span class="lbl">Status</span><b>${esc(t.status)}</b></div>
    <div class="mrow"><span class="lbl">Priority</span>${esc(t.priority)} · ${esc(t.complexity)}${t.has_ui?' · has UI':''}</div>
    <div class="mrow"><span class="lbl">Depends on</span>${(t.depends_on&&t.depends_on.length)?t.depends_on.map(esc).join(", "):'—'}</div>
    <div class="mrow" style="display:block"><span class="lbl">Description</span><div style="margin-top:7px;color:var(--muted);line-height:1.6">${esc(t.description)||'—'}</div></div>`;
  if(tech)h+=`<div class="mrow" style="display:block;border:none"><span class="lbl">Technical design</span>
    <pre>${esc(tech.approach)}\nfiles: ${esc((tech.files||[]).join(", "))}\napi: ${esc(tech.api_contract)}\ntest: ${esc(tech.test_plan)}</pre></div>`;
  if(ux)h+=`<div class="mrow" style="display:block;border:none"><span class="lbl">UX design</span><pre>${esc(ux.user_flow)}\nscreens: ${esc((ux.screens||[]).join(", "))}</pre></div>`;
  document.getElementById("ticket-body").innerHTML=h;document.getElementById("ov-ticket").classList.add("open");}
async function openSettings(){let cfg={};try{cfg=await(await fetch("/api/config")).json();}catch(e){}
  const def=cfg.engine&&cfg.engine.default||{engine:"claude",model:"sonnet"},per=cfg.engine&&cfg.engine.per_role||{};
  const eng=["opencode","claude","scripted","mock"],opt=(s)=>eng.map(e=>`<option ${e===s?'selected':''}>${e}</option>`).join("");
  let rows=`<div class="mrow"><span class="lbl">Default</span><select id="eng-default">${opt(def.engine)}</select>
    <input id="mdl-default" value="${esc(def.model)}" placeholder="model" style="flex:1"/></div>`;
  rows+=ROLES.map(r=>{const c=per[r]||{};return `<div class="mrow"><span class="lbl">${r}</span>
    <select id="eng-${r}"><option value="">default</option>${eng.map(e=>`<option ${c.engine===e?'selected':''}>${e}</option>`).join("")}</select>
    <input id="mdl-${r}" value="${esc(c.model||'')}" placeholder="model override" style="flex:1"/></div>`;}).join("");
  document.getElementById("settings-body").innerHTML=`<span class="x" onclick="close_('ov-settings')"><i class="ti ti-x"></i></span>
    <h3>Engine settings</h3><div class="msub">which engine and model each agent uses · applies on restart</div>
    ${rows}<button class="save" onclick="saveSettings()">Save changes</button>
    <span id="save-note" style="margin-left:11px;color:var(--muted);font-size:12px"></span>`;
  document.getElementById("ov-settings").classList.add("open");window._cfg=cfg;}
async function saveSettings(){const cfg=window._cfg||{engine:{},workflow:{}};cfg.engine=cfg.engine||{};
  cfg.engine.default={engine:document.getElementById("eng-default").value,model:document.getElementById("mdl-default").value};
  const per={};ROLES.forEach(r=>{const e=document.getElementById("eng-"+r).value,m=document.getElementById("mdl-"+r).value;if(e)per[r]={engine:e,model:m||"sonnet"};});
  cfg.engine.per_role=per;
  try{const res=await(await fetch("/api/config",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(cfg)})).json();
    document.getElementById("save-note").textContent=res.ok?"saved · restart to apply":"error";}catch(e){document.getElementById("save-note").textContent="error";}}
function close_(id){document.getElementById(id).classList.remove("open");}
function setConn(on){document.getElementById("conn").className="dot "+(on?"live":"off");document.getElementById("connlbl").textContent=on?"live":"reconnecting";}
function renderRunner(r){if(!r)return;const c=r.mode==="running"?"live":(r.mode==="paused"?"paused":"off");
  document.getElementById("runmode").className="dot "+c;
  document.getElementById("runlbl").textContent=r.mode+" · cycle "+r.cycle;
  document.getElementById("runsum").textContent=r.last_summary||"idle";}
async function ctl(a){try{renderRunner(await(await fetch("/api/control/"+a,{method:"POST"})).json());}catch(e){}}
let poll=null;
function handle(m){if(m.state)render(m.state);renderRunner(m.runner);setConn(true);}
function startPoll(){if(poll)return;poll=setInterval(async()=>{try{const s=await(await fetch("/api/state")).json();const rn=await(await fetch("/api/runner")).json();render(s);renderRunner(rn);setConn(false);}catch(e){}},3000);}
function connect(){const es=new EventSource("/api/events");
  es.onmessage=e=>{try{handle(JSON.parse(e.data));if(poll){clearInterval(poll);poll=null;}}catch(_){}};
  es.onerror=()=>{setConn(false);startPoll();};}
connect();
</script>
