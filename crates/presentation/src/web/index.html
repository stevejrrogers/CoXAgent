<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CoXAgent · Control Center</title>
<style>
  :root{
    --bg:#0B0E14; --surf:#12161F; --surf2:#171C28; --border:#242A38; --border2:#1B2130;
    --text:#E6EDF3; --muted:#8B95A7; --dim:#4A5266;
    --blue:#58A6FF; --green:#3FB950; --amber:#E3B341; --red:#F85149;
    --purple:#BC8CFF; --teal:#39D353; --orange:#F0883E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:14px}
  .header{display:flex;align-items:center;gap:12px;padding:12px 22px;
    background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
  .logo{width:34px;height:34px;border-radius:9px;flex-shrink:0;
    background:linear-gradient(135deg,var(--blue),var(--purple));
    display:flex;align-items:center;justify-content:center;font-size:18px}
  .title{font-weight:700;font-size:16px;letter-spacing:-.01em}
  .sub{font-size:12px;color:var(--muted)}
  .spacer{flex:1}
  .pill{padding:5px 11px;border-radius:20px;background:var(--surf2);
    border:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .pill b{color:var(--text)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .dot.live{animation:pulse 1.8s infinite}
  .dot.off{background:var(--red);animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .wrap{padding:20px 22px;max-width:1440px;margin:0 auto}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
    margin:24px 0 12px;font-weight:700}
  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{background:var(--surf);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;position:relative;overflow:hidden}
  .kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--blue))}
  .kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .kpi .v{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
  .kpi .foot{font-size:11px;color:var(--dim);margin-top:2px}
  .spark{display:block;margin-top:8px}
  /* agents */
  .agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
  .agent{background:var(--surf);border:1px solid var(--border);border-radius:11px;padding:12px 14px}
  .agent .role{font-size:13px;font-weight:600;margin-bottom:3px}
  .agent .st{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .agent .st .d{width:6px;height:6px;border-radius:50%;background:var(--dim)}
  .agent.run{border-color:rgba(63,185,80,.4)}
  .agent.run .st{color:var(--green)} .agent.run .st .d{background:var(--green);animation:pulse 1.6s infinite}
  .agent .desc{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.4}
  /* board */
  .layout{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .col{background:var(--surf);border:1px solid var(--border);border-radius:11px;padding:11px;min-height:80px}
  .col h3{margin:0 0 9px;font-size:12px;display:flex;align-items:center;gap:6px;font-weight:600}
  .col h3 .n{margin-left:auto;background:var(--surf2);border-radius:10px;padding:1px 8px;font-size:11px;color:var(--muted)}
  .card{background:var(--surf2);border:1px solid var(--border2);border-radius:9px;
    padding:10px 11px;margin-bottom:8px;border-left:2px solid var(--accent,var(--dim))}
  .card .cid{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
  .card .ct{font-size:13px;margin:3px 0 7px;line-height:1.35}
  .badges{display:flex;gap:5px;flex-wrap:wrap}
  .b{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600}
  .b.high{background:rgba(248,81,73,.15);color:var(--red)}
  .b.medium{background:rgba(227,179,65,.15);color:var(--amber)}
  .b.low{background:rgba(139,149,167,.15);color:var(--muted)}
  .b.ui{background:rgba(188,140,255,.15);color:var(--purple)}
  .b.bug{background:rgba(248,81,73,.15);color:var(--red)}
  .empty{color:var(--dim);font-size:12px;text-align:center;padding:14px 0}
  .side{background:var(--surf);border:1px solid var(--border);border-radius:11px;padding:15px}
  .rel{border-left:2px solid var(--border);padding:0 0 14px 13px;margin-left:4px;position:relative}
  .rel:last-child{padding-bottom:0}
  .rel:before{content:"";position:absolute;left:-5px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--green)}
  .rel .v{font-weight:600;font-size:13px}
  .rel .d{font-size:11px;color:var(--muted)}
  .rel .t{font-size:12px;color:var(--muted);margin-top:2px}
  .foot{color:var(--dim);font-size:11px;text-align:center;padding:22px}
</style>
</head>
<body>
  <div class="header">
    <div class="logo">🤖</div>
    <div>
      <div class="title">CoXAgent · Control Center</div>
      <div class="sub">autonomous software team</div>
    </div>
    <div class="spacer"></div>
    <div class="pill"><span class="dot off" id="conn"></span><span id="connlbl">connecting</span></div>
    <div class="pill">version <b id="ver">—</b></div>
  </div>

  <div class="wrap">
    <h2>Overview</h2>
    <div class="kpis" id="kpis"></div>

    <h2>Team</h2>
    <div class="agents" id="agents"></div>

    <div class="layout">
      <div>
        <h2>Feature board</h2>
        <div class="cols" id="features"></div>
        <h2>Bugs</h2>
        <div class="cols" id="bugs"></div>
      </div>
      <div>
        <h2>Changelog</h2>
        <div class="side" id="changelog"></div>
      </div>
    </div>
    <div class="foot" id="footer">—</div>
  </div>

<script>
const AGENTS = [
  ["BA","proposes features"],["PO","owns priority"],["SM","runs the process"],
  ["SA","designs the how"],["PD","owns UX"],["DEV-BUG","fixes bugs"],
  ["DEV-FEATURE","builds features"],["TEST","verifies + finds bugs"],["DOCS","writes guides"]
];
const FCOLS=[["pending","Pending","var(--muted)"],["ready","Ready","var(--blue)"],
  ["in_progress","In progress","var(--amber)"],["done","Done","var(--green)"],["documented","Documented","var(--teal)"]];
const BCOLS=[["open","Open","var(--red)"],["fixed","Fixed","var(--amber)"],["verified","Verified","var(--green)"]];
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function kpi(k,v,foot,accent){
  return `<div class="kpi" style="--accent:${accent}"><div class="k">${k}</div>
    <div class="v">${v}</div><div class="foot">${foot||""}</div></div>`;
}
function sparkline(days){
  if(!days.length) return "";
  const w=150,h=30,max=Math.max(...days.map(d=>d.count),1);
  const step=days.length>1?w/(days.length-1):0;
  const pts=days.map((d,i)=>`${(i*step).toFixed(1)},${(h-2-(d.count/max)*(h-4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}"><polyline fill="none" stroke="var(--blue)"
    stroke-width="1.5" points="${pts}"/></svg>`;
}
function metricsFrom(s){
  const t=s.tickets||[], h=s.history||[];
  const isFeat=x=>x.type!=="bug";
  const shipped=t.filter(x=>isFeat(x)&&(x.status==="done"||x.status==="documented")).length;
  const inflight=t.filter(x=>isFeat(x)&&(x.status==="ready"||x.status==="in_progress")).length;
  const openBugs=t.filter(x=>x.type==="bug"&&x.status==="open").length;
  const verBugs=t.filter(x=>x.type==="bug"&&x.status==="verified").length;
  const featDeploys=h.filter(r=>/^(FEAT|CHORE)/.test(r.ticket)).length;
  const ratio=h.length?Math.round(featDeploys*100/h.length):0;
  const dayMap={}; h.forEach(r=>{const d=(r.at||"").split("T")[0]; dayMap[d]=(dayMap[d]||0)+1;});
  const days=Object.keys(dayMap).sort().map(d=>({day:d,count:dayMap[d]}));
  return {shipped,inflight,openBugs,verBugs,releases:h.length,ratio,days};
}
function card(t){
  const accent={high:"var(--red)",medium:"var(--amber)",low:"var(--dim)"}[t.priority]||"var(--dim)";
  const ui=t.has_ui?'<span class="b ui">UI</span>':'';
  const bug=t.type==="bug"?'<span class="b bug">bug</span>':'';
  return `<div class="card" style="--accent:${accent}"><div class="cid">${esc(t.id)}</div>
    <div class="ct">${esc(t.title)}</div>
    <div class="badges"><span class="b ${t.priority}">${t.priority}</span>${ui}${bug}</div></div>`;
}
function column([key,label,color],ts){
  const items=ts.filter(t=>t.status===key);
  const body=items.length?items.map(card).join(""):'<div class="empty">—</div>';
  return `<div class="col"><h3><span style="color:${color}">●</span>${label}<span class="n">${items.length}</span></h3>${body}</div>`;
}
function render(s){
  const m=metricsFrom(s);
  document.getElementById("ver").textContent=s.current_version;
  document.getElementById("kpis").innerHTML=[
    kpi("Shipped",m.shipped,"features done","var(--green)"),
    kpi("In flight",m.inflight,"ready + in progress","var(--amber)"),
    kpi("Open bugs",m.openBugs,m.verBugs+" verified","var(--red)"),
    kpi("Releases",m.releases,"feature ratio "+m.ratio+"%","var(--blue)"),
    kpi("Deploys",m.days.reduce((a,d)=>a+d.count,0),sparkline(m.days),"var(--purple)"),
  ].join("");
  const active=s.tickets.filter(t=>t.status==="in_progress");
  document.getElementById("agents").innerHTML=AGENTS.map(([r,d])=>{
    const run=active.length&&(r==="DEV-FEATURE"||r==="DEV-BUG");
    return `<div class="agent ${run?'run':''}"><div class="role">${r}</div>
      <div class="st"><span class="d"></span>${run?'working':'standby'}</div>
      <div class="desc">${d}</div></div>`;
  }).join("");
  const feats=s.tickets.filter(t=>t.type!=="bug"), bugs=s.tickets.filter(t=>t.type==="bug");
  document.getElementById("features").innerHTML=FCOLS.map(c=>column(c,feats)).join("");
  document.getElementById("bugs").innerHTML=BCOLS.map(c=>column(c,bugs)).join("");
  const h=s.history||[];
  document.getElementById("changelog").innerHTML=h.length
    ?[...h].reverse().map(r=>`<div class="rel"><div class="v">v${esc(r.version)}</div>
      <div class="d">${esc((r.at||"").split("T")[0])}</div>
      <div class="t">${esc(r.title)} <span style="color:var(--dim)">(${esc(r.ticket)})</span></div></div>`).join("")
    :'<div class="empty">no releases yet</div>';
  document.getElementById("footer").textContent="live · updated "+new Date().toLocaleTimeString();
}
function setConn(on){
  document.getElementById("conn").className="dot "+(on?"live":"off");
  document.getElementById("connlbl").textContent=on?"live":"reconnecting";
}
// Prefer SSE; fall back to polling if the stream drops.
let poll=null;
function startPoll(){ if(poll)return; poll=setInterval(async()=>{
  try{const r=await fetch("/api/state");render(await r.json());setConn(false);}catch(e){} },3000); }
function connect(){
  const es=new EventSource("/api/events");
  es.onmessage=e=>{ try{render(JSON.parse(e.data));setConn(true);if(poll){clearInterval(poll);poll=null;}}catch(_){} };
  es.onerror=()=>{ setConn(false); startPoll(); };
}
connect();
</script>
</body>
</html>
