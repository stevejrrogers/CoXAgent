<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CoXAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" rel="stylesheet">
<style>
  :root{--bg:#0A0A0F;--panel:#101017;--card:#15151D;--card2:#1B1B24;--hover:#20202B;
    --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
    --text:#F1F2F6;--muted:#9A9DAB;--dim:#5E616C;
    --accent:#0891B2;--accenth:#0AA3C2;--accent2:#34D9EE;--accentbg:rgba(52,217,238,.14);
    --green:#4ADE80;--amber:#FBBF24;--red:#F87171;--blue:#60A5FA;--teal:#2DD4BF;--purple:#A78BFA;--r:14px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:14px;display:flex;-webkit-font-smoothing:antialiased}
  .ti{font-size:18px;line-height:1;vertical-align:-2px}
  .side{width:246px;flex-shrink:0;height:100vh;position:sticky;top:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 16px;gap:6px}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 6px 14px}
  .brand .mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#22D3EE,#0E7490);display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px}
  .brand .nm{font-weight:600;font-size:15px} .brand .tg{font-size:11px;color:var(--dim)}
  .proj{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;margin-bottom:6px}
  .proj .pn{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
  .proj .al{background:var(--accentbg);color:var(--accent2);font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px}
  .proj .pv{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:10px}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;cursor:pointer}
  .nav a:hover{background:var(--card);color:var(--text)} .nav a.on{background:var(--accentbg);color:var(--accent2)}
  .runner{margin-top:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px}
  .runner .rt{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-bottom:3px}
  .runner .rc{font-size:11px;color:var(--muted);margin-bottom:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ctlrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .ctlrow button{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:8px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:inherit}
  .ctlrow button:hover{background:var(--hover);border-color:var(--border2)}
  .ctlrow button.pri{grid-column:1/3;background:var(--accent);border-color:transparent;color:#fff} .ctlrow button.pri:hover{background:var(--accenth)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex-shrink:0}
  .dot.live{background:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.18);animation:pulse 1.8s infinite}
  .dot.paused{background:var(--amber)} .dot.off{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .main{flex:1;min-width:0;height:100vh;overflow:auto}
  .topbar{position:sticky;top:0;z-index:4;background:rgba(10,10,15,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:15px 28px;display:flex;align-items:center;gap:12px}
  .topbar h1{font-size:17px;font-weight:600;margin:0} .topbar .sub{font-size:12px;color:var(--muted);margin-left:2px}
  .topbar .sp{flex:1}
  .chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--muted)}
  .content{padding:24px 28px;max-width:1340px}
  .view{display:none} .view.on{display:block}
  .sec{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin:26px 0 13px;display:flex;align-items:center;gap:8px}
  .sec:first-child{margin-top:0}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:13px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 17px}
  .kpi .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--accentbg);color:var(--accent2);margin-bottom:11px}
  .kpi .v{font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1} .kpi .k{font-size:12px;color:var(--muted);margin-top:5px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:17px}
  .panel h4{margin:0 0 13px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
  .panel h4 .mo{margin-left:auto;font-size:11px;color:var(--dim);cursor:pointer;font-weight:500}
  .agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
  .agent{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;display:flex;gap:13px;align-items:flex-start}
  .av{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;position:relative}
  .av .sr{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);background:var(--dim)}
  .agent.run .av .sr{background:var(--green);animation:pulse 1.6s infinite}
  .agent .rl{font-size:14px;font-weight:600} .agent .ds{font-size:12px;color:var(--dim);margin-top:2px} .agent.run .ds{color:var(--green)}
  .agent .st{font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center}
  .cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .col{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px;min-height:120px}
  .col h3{margin:0 0 12px;font-size:12px;display:flex;align-items:center;gap:7px;font-weight:600}
  .col h3 .n{margin-left:auto;background:var(--card2);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--muted);font-weight:600}
  .card-t{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:border-color .12s}
  .card-t:hover{border-color:var(--border2)}
  .card-t .cid{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
  .card-t .ct{font-size:13px;margin:4px 0 8px;line-height:1.4}
  .badges{display:flex;gap:5px;flex-wrap:wrap}
  .b{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:600}
  .b.high{background:rgba(248,113,113,.16);color:#fca5a5} .b.medium{background:rgba(251,191,36,.16);color:#fcd34d}
  .b.low{background:rgba(154,157,171,.16);color:var(--muted)} .b.ui{background:rgba(167,139,250,.16);color:#c4b5fd} .b.bug{background:rgba(248,113,113,.16);color:#fca5a5}
  .empty{color:var(--dim);font-size:12px;text-align:center;padding:22px 0}
  .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .fchip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 13px;font-size:12px;color:var(--muted);cursor:pointer;font-weight:500}
  .fchip.on{background:var(--accentbg);border-color:transparent;color:var(--accent2)}
  select.sel{background:var(--card);color:var(--text);border:1px solid var(--border2);border-radius:9px;padding:7px 10px;font-size:12px;font-family:inherit}
  .act{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);align-items:flex-start}
  .act:last-child{border:none}
  .act .ad{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
  .act .atx{flex:1;font-size:13px;line-height:1.5} .act .atx .who{font-weight:600} .act .atx .tk{color:var(--muted);font-family:ui-monospace,monospace;font-size:11px}
  .act .tm{color:var(--dim);font-size:11px;white-space:nowrap}
  .rel{display:flex;gap:11px;padding-bottom:14px} .rel:last-child{padding-bottom:0}
  .rel .rv{background:var(--accentbg);color:var(--accent2);font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;height:fit-content}
  .rel .rt{font-size:12px} .rel .rt .rd{color:var(--dim);font-size:11px;margin-top:2px}
  .frm .fr{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
  .frm .fr .lbl{min-width:150px;font-size:13px} .frm .fr .hint{font-size:11px;color:var(--dim)}
  .frm input,.frm select{background:var(--card2);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:7px 9px;font-size:12px;font-family:inherit}
  .frm input:focus,.frm select:focus{outline:none;border-color:var(--accent)}
  .save{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:600;cursor:pointer;margin-top:18px;font-family:inherit;font-size:13px}
  .save:hover{background:var(--accenth)}
  .ov{position:fixed;inset:0;background:rgba(5,5,9,.62);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
  .ov.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border2);border-radius:18px;max-width:580px;width:100%;max-height:86vh;overflow:auto;padding:22px 24px}
  .modal h3{margin:0;font-size:19px;font-weight:600} .modal .x{float:right;cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .modal .x:hover{background:var(--card);color:var(--text)} .modal .msub{color:var(--muted);font-size:12px;margin:2px 0 16px}
  .mrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px} .mrow .lbl{color:var(--muted);min-width:118px}
  .modal pre{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px;overflow:auto;white-space:pre-wrap;line-height:1.55;font-family:ui-monospace,monospace}
</style>
</head>
<body>
  <aside class="side">
    <div class="brand"><div class="mk"><i class="ti ti-hexagon-letter-c"></i></div><div><div class="nm">CoXAgent</div><div class="tg">autonomous dev team</div></div></div>
    <div class="proj"><div class="pn"><i class="ti ti-folder" style="color:var(--muted)"></i><span id="pn-name">Project</span><span class="al" id="pn-alias">—</span></div>
      <div class="pv"><span><i class="ti ti-tag" style="font-size:13px"></i> v<b id="ver">0.0.0</b></span><span id="pn-tickets">0 tickets</span></div></div>
    <nav class="nav">
      <a data-v="overview" class="on" onclick="nav('overview')"><i class="ti ti-layout-dashboard"></i> Overview</a>
      <a data-v="team" onclick="nav('team')"><i class="ti ti-users"></i> Team</a>
      <a data-v="board" onclick="nav('board')"><i class="ti ti-columns"></i> Board</a>
      <a data-v="sprint" onclick="nav('sprint')"><i class="ti ti-run"></i> Sprint</a>
      <a data-v="activity" onclick="nav('activity')"><i class="ti ti-activity"></i> Activity</a>
      <a data-v="insights" onclick="nav('insights')"><i class="ti ti-coin"></i> Cost</a>
      <a data-v="settings" onclick="nav('settings')"><i class="ti ti-settings"></i> Settings</a>
    </nav>
    <div class="runner"><div class="rt"><span class="dot off" id="runmode"></span><span id="runlbl">idle</span></div>
      <div class="rc" id="runsum">paused</div>
      <div class="ctlrow"><button class="pri" onclick="ctl('resume')"><i class="ti ti-player-play"></i> Resume</button>
        <button onclick="ctl('step')"><i class="ti ti-player-track-next"></i> Step</button>
        <button onclick="ctl('pause')"><i class="ti ti-player-pause"></i> Pause</button></div></div>
  </aside>

  <main class="main">
    <div class="topbar"><h1 id="pg-title">Overview</h1><span class="sub" id="pg-sub"></span><div class="sp"></div>
      <div class="chip"><span class="dot off" id="conn"></span><span id="connlbl">connecting</span></div></div>
    <div class="content">
      <div class="view on" id="view-overview">
        <div id="ov-alerts"></div>
        <div class="kpis" id="kpis"></div>
        <div id="ov-deploy"></div>
        <div class="row2">
          <div class="panel"><h4><i class="ti ti-activity" style="color:var(--accent2)"></i> Recent activity <span class="mo" onclick="nav('activity')">view all</span></h4><div id="ov-activity"></div></div>
          <div class="panel"><h4><i class="ti ti-history" style="color:var(--accent2)"></i> Releases</h4><div id="ov-changelog"></div></div>
        </div>
      </div>
      <div class="view" id="view-team"><div class="agents" id="agents"></div></div>
      <div class="view" id="view-board">
        <div class="filters" id="board-filters"></div>
        <div class="sec">Features</div><div class="cols" id="features"></div>
        <div class="sec">Bugs</div><div class="cols" id="bugs"></div>
      </div>
      <div class="view" id="view-activity">
        <div class="filters"><span style="font-size:12px;color:var(--muted)">Filter</span><select class="sel" id="act-filter" onchange="renderActive()"><option value="">all agents</option></select>
          <div style="flex:1"></div><a href="/api/audit" class="fchip" style="text-decoration:none"><i class="ti ti-download" style="font-size:14px"></i> Export audit</a></div>
        <div class="panel"><div id="activity-full"></div></div>
      </div>
      <div class="view" id="view-sprint"><div id="sprint-body"></div></div>
      <div class="view" id="view-insights"><div class="kpis" id="cost-kpis"></div>
        <div class="sec">Cost by agent</div><div class="panel" id="cost-roles"></div>
        <div class="sec">Budget</div><div class="panel" id="cost-budget"></div></div>
      <div class="view" id="view-settings"><div id="settings-body"></div></div>
    </div>
  </main>

  <div class="ov" id="ov-ticket" onclick="if(event.target===this)close_('ov-ticket')"><div class="modal" id="ticket-body"></div></div>

<script>
const AGENTS=[["BA","proposes features","--blue"],["PO","owns priority","--amber"],["SM","runs the process","--teal"],
  ["SA","designs the how","--purple"],["PD","owns UX","--purple"],["DEV-BUG","fixes bugs","--red"],
  ["DEV-FEATURE","builds features","--green"],["TEST","verifies work","--teal"],["DOCS","writes guides","--blue"]];
const FCOLS=[["pending","Pending","--muted"],["ready","Ready","--blue"],["in_progress","In progress","--amber"],["done","Done","--green"],["documented","Documented","--teal"]];
const BCOLS=[["open","Open","--red"],["fixed","Fixed","--amber"],["verified","Verified","--green"]];
const ROLES=["ba","po","sm","sa","pd","dev_bug","dev_feature","test","docs"];
const MODELS={claude:["sonnet","opus","haiku"],scripted:["n/a"],mock:["n/a"],opencode:null};
function modelControl(eng,cur,sid){
  if(!eng)return `<input id="mdl-${sid}" value="" placeholder="uses default model" disabled style="flex:1;opacity:.45"/>`;
  const list=MODELS[eng];
  if(!list)return `<input id="mdl-${sid}" value="${esc(cur)}" placeholder="provider/model" style="flex:1"/>`;
  const opts=[...list]; if(cur&&!opts.includes(cur))opts.unshift(cur);
  return `<select id="mdl-${sid}" style="flex:1">${opts.map(m=>`<option ${m===cur?'selected':''}>${esc(m)}</option>`).join("")}</select>`;
}
function onEngine(sid){const eng=document.getElementById("eng-"+sid).value;
  const list=MODELS[eng];const def=(list&&list.length)?list[0]:"";
  document.getElementById("mc-"+sid).innerHTML=modelControl(eng,def,sid);}
const KPI_IC={Shipped:"ti-rocket","In flight":"ti-plane-tilt","Open bugs":"ti-bug",Documented:"ti-book",Releases:"ti-versions",Cost:"ti-coin","Total spend":"ti-coin",Tokens:"ti-cpu",Runs:"ti-repeat"};
const money=n=>"$"+(Number(n)||0).toFixed(2);
const fmtK=n=>{n=Number(n)||0;return n>=1000?(n/1000).toFixed(1)+"k":String(n);};
const AC={BA:"--blue","DEV-FEATURE":"--green","DEV-BUG":"--red",SA:"--purple",TEST:"--teal",DOCS:"--blue",PO:"--amber",SM:"--teal",PD:"--purple"};
const TITLES={overview:["Overview","project health at a glance"],team:["Team","nine agents, one loop"],board:["Board","every ticket, every stage"],activity:["Activity","what the agents are doing"],sprint:["Sprint","the current scrum window"],insights:["Cost","token spend across the team"],settings:["Settings","engines, models, workflow"]};
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const cvar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#888";
let STATE={}, CUR="overview", BF="all", INIT_ACT=false;

function nav(v){CUR=v;location.hash=v;
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  document.getElementById("view-"+v).classList.add("on");
  document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  document.getElementById("pg-title").textContent=TITLES[v][0];
  document.getElementById("pg-sub").textContent=TITLES[v][1];
  if(v==="settings")loadSettings(); else renderActive();}
function initials(r){return r.replace("DEV-","").slice(0,2);}
function metricsFrom(s){const t=s.tickets||[],h=s.history||[],isF=x=>x.type!=="bug";
  return {shipped:t.filter(x=>isF(x)&&(x.status==="done"||x.status==="documented")).length,
    inflight:t.filter(x=>isF(x)&&(x.status==="ready"||x.status==="in_progress")).length,
    openBugs:t.filter(x=>x.type==="bug"&&x.status==="open").length,
    docd:t.filter(x=>x.status==="documented").length,releases:h.length};}
function kpi(k,v){return `<div class="kpi"><div class="ic"><i class="ti ${KPI_IC[k]||'ti-point'}"></i></div><div class="v">${v}</div><div class="k">${k}</div></div>`;}
function alertsHtml(s,m,spend){
  const al=[];
  if(s.deploy&&!s.deploy.ok)al.push(["red","cloud-x","Last deployment failed",esc(s.deploy.summary)]);
  const bud=window._budget;
  if(bud&&spend.total_cost_usd>=bud)al.push(["red","alert-triangle","Budget cap reached",money(spend.total_cost_usd)+" of "+money(bud)+" — loop paused"]);
  else if(bud&&spend.total_cost_usd>=bud*0.8)al.push(["amber","alert-triangle","Budget nearly reached",Math.round(spend.total_cost_usd/bud*100)+"% of "+money(bud)]);
  if(m.openBugs>=5)al.push(["amber","bug",m.openBugs+" open bugs","DEV-BUG is prioritising fixes over features"]);
  if(!al.length)return "";
  return al.map(([c,ic,t,d])=>`<div class="panel" style="margin-bottom:12px;display:flex;align-items:center;gap:12px;border-color:var(--${c})">
    <i class="ti ti-${ic}" style="font-size:20px;color:var(--${c})"></i>
    <div><div style="font-size:13px;font-weight:600">${t}</div><div style="font-size:12px;color:var(--muted)">${d}</div></div></div>`).join("");
}
function velocityHtml(sprints){
  if(!sprints.length)return "";
  const max=Math.max(...sprints.map(s=>s.committed),1);
  const bars=sprints.slice(-10).map(s=>{const h=Math.max(6,Math.round(s.done/max*90));const hc=Math.max(6,Math.round(s.committed/max*90));
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1">
      <div style="position:relative;height:96px;width:26px;display:flex;align-items:flex-end">
        <div style="position:absolute;bottom:0;width:100%;height:${hc}px;background:var(--card2);border-radius:4px"></div>
        <div style="position:absolute;bottom:0;width:100%;height:${h}px;background:var(--accent2);border-radius:4px"></div></div>
      <div style="font-size:10px;color:var(--dim)">#${s.number}</div></div>`;}).join("");
  return `<div class="sec">Velocity</div><div class="panel"><div style="display:flex;gap:10px;align-items:flex-end">${bars}</div>
    <div style="color:var(--dim);font-size:11px;margin-top:10px">shipped (cyan) vs committed (grey) per closed sprint</div></div>`;
}
function actItem(a){const col=cvar(AC[a.agent]||"--muted");
  return `<div class="act"><div class="ad" style="background:${col}22;color:${col}">${initials(a.agent)}</div>
    <div class="atx"><span class="who">${esc(a.agent)}</span> ${esc(a.action)} ${a.ticket?`<span class="tk">${esc(a.ticket)}</span>`:''}</div>
    <span class="tm">${esc((a.at||"").slice(11,16))}</span></div>`;}
function card(t){const a={high:"var(--red)",medium:"var(--amber)",low:"var(--dim)"}[t.priority]||"var(--dim)";
  const ui=t.has_ui?'<span class="b ui">UI</span>':'',bug=t.type==="bug"?'<span class="b bug">bug</span>':'';
  return `<div class="card-t" onclick="showTicket('${t.id}')"><div class="cid">${esc(t.id)}</div>
    <div class="ct">${esc(t.title)}</div><div class="badges"><span class="b ${t.priority}">${t.priority}</span>${ui}${bug}</div></div>`;}
function column([k,l,c],ts){const items=ts.filter(t=>t.status===k);
  return `<div class="col"><h3><span class="dot" style="background:var(${c})"></span>${l}<span class="n">${items.length}</span></h3>${items.length?items.map(card).join(""):'<div class="empty">—</div>'}</div>`;}

function renderSidebar(s){
  document.getElementById("ver").textContent=s.current_version||"0.0.0";
  document.getElementById("pn-name").textContent=s.alias?s.alias+" project":"Project";
  document.getElementById("pn-alias").textContent=s.alias||"—";
  document.getElementById("pn-tickets").textContent=(s.tickets||[]).length+" tickets";}
function renderActive(){const s=STATE; if(!s.tickets&&!s.activity)return;
  if(CUR==="overview"){
    if(!(s.tickets||[]).length&&!(s.activity||[]).length){
      document.getElementById("kpis").innerHTML=`<div class="panel" style="grid-column:1/-1;text-align:center;padding:40px 20px">
        <i class="ti ti-rocket" style="font-size:34px;color:var(--accent2)"></i>
        <div style="font-size:17px;font-weight:600;margin:12px 0 4px">Ready to build</div>
        <div style="color:var(--muted);font-size:13px;max-width:440px;margin:0 auto 6px">The team is standing by. Press <b style="color:var(--text)">Resume</b> to start the loop — BA proposes features, SA designs them, DEV builds, TEST verifies, DOCS writes guides.</div>
        <div style="color:var(--dim);font-size:12px">Set engines and workflow in <a onclick="nav('settings')" style="color:var(--accent2);cursor:pointer">Settings</a>.</div></div>`;
      document.getElementById("ov-alerts").innerHTML='';
      document.getElementById("ov-deploy").innerHTML='';
      document.getElementById("ov-activity").innerHTML='<div class="empty">activity appears as agents work</div>';
      document.getElementById("ov-changelog").innerHTML='<div class="empty">no releases yet</div>';
      return;
    }
    const m=metricsFrom(s);
    const spend=s.spend||{};
    document.getElementById("ov-alerts").innerHTML=alertsHtml(s,m,spend);
    document.getElementById("kpis").innerHTML=[kpi("Shipped",m.shipped),kpi("In flight",m.inflight),kpi("Open bugs",m.openBugs),kpi("Documented",m.docd),kpi("Releases",m.releases),kpi("Cost",money(spend.total_cost_usd))].join("");
    const dp=s.deploy;
    document.getElementById("ov-deploy").innerHTML=dp?`<div class="panel" style="margin-top:16px;display:flex;align-items:center;gap:13px">
      <div class="av" style="width:36px;height:36px;background:${dp.ok?'var(--green)':'var(--red)'}22;color:${dp.ok?'var(--green)':'var(--red)'}"><i class="ti ti-${dp.ok?'cloud-check':'cloud-x'}"></i></div>
      <div style="flex:1"><div style="font-size:13px;font-weight:600">Deployment ${dp.ok?'healthy':'failed'}</div><div style="font-size:12px;color:var(--muted)">${esc(dp.summary)}</div></div>
      <div style="font-size:11px;color:var(--dim)">${esc((dp.at||"").slice(0,16).replace("T"," "))}</div></div>`:"";
    const act=[...(s.activity||[])].reverse().slice(0,7);
    document.getElementById("ov-activity").innerHTML=act.length?act.map(actItem).join(""):'<div class="empty">no activity yet</div>';
    const h=s.history||[];
    document.getElementById("ov-changelog").innerHTML=h.length?[...h].reverse().slice(0,6).map(r=>`<div class="rel"><span class="rv">v${esc(r.version)}</span><div class="rt">${esc(r.title)}<div class="rd">${esc((r.at||"").split("T")[0])} · ${esc(r.ticket)}</div></div></div>`).join(""):'<div class="empty">no releases yet</div>';
  }else if(CUR==="team"){
    const active=(s.tickets||[]).filter(t=>t.status==="in_progress");
    const counts={};(s.activity||[]).forEach(a=>counts[a.agent]=(counts[a.agent]||0)+1);
    document.getElementById("agents").innerHTML=AGENTS.map(([r,d,c])=>{
      const run=active.length&&(r==="DEV-FEATURE"||r==="DEV-BUG");const col=cvar(c);const n=counts[r]||0;
      const work=run?active[0].id:null;
      return `<div class="agent ${run?'run':''}"><div class="av" style="background:${col}22;color:${col}">${initials(r)}<span class="sr"></span></div>
        <div style="flex:1"><div class="rl">${r}</div><div class="ds">${d}</div>
        <div class="st">${run?`<i class="ti ti-loader-2" style="font-size:13px"></i> on ${work}`:`<i class="ti ti-checkbox" style="font-size:13px"></i> ${n} actions`}</div></div></div>`;}).join("");
  }else if(CUR==="board"){
    let feats=(s.tickets||[]).filter(t=>t.type!=="bug"),bugs=(s.tickets||[]).filter(t=>t.type==="bug");
    if(BF!=="all"){feats=feats.filter(t=>t.priority===BF);bugs=bugs.filter(t=>t.priority===BF);}
    const fc=["all","high","medium","low"];
    document.getElementById("board-filters").innerHTML=fc.map(f=>`<span class="fchip ${BF===f?'on':''}" onclick="BF='${f}';renderActive()">${f==='all'?'all priorities':f}</span>`).join("");
    document.getElementById("features").innerHTML=FCOLS.map(c=>column(c,feats)).join("");
    document.getElementById("bugs").innerHTML=BCOLS.map(c=>column(c,bugs)).join("");
  }else if(CUR==="activity"){
    const sel=document.getElementById("act-filter");
    if(!INIT_ACT){const agents=[...new Set((s.activity||[]).map(a=>a.agent))];
      sel.innerHTML='<option value="">all agents</option>'+agents.map(a=>`<option>${esc(a)}</option>`).join("");INIT_ACT=true;}
    const f=sel.value;let act=[...(s.activity||[])].reverse();if(f)act=act.filter(a=>a.agent===f);
    document.getElementById("activity-full").innerHTML=act.length?act.map(actItem).join(""):'<div class="empty">no activity</div>';
  }else if(CUR==="sprint"){
    const sp=s.sprint;
    if(!sp){document.getElementById("sprint-body").innerHTML='<div class="panel"><div class="empty">Kanban mode — no sprints. Switch to scrum in Settings.</div></div>';}
    else{
      const done=(sp.committed||[]).filter(id=>{const t=(s.tickets||[]).find(x=>x.id===id);return t&&(t.status==="done"||t.status==="documented");});
      const total=(sp.committed||[]).length,pct=total?Math.round(done.length/total*100):0;
      const rows=(sp.committed||[]).map(id=>{const t=(s.tickets||[]).find(x=>x.id===id)||{id,title:"(removed)",status:"?"};
        const shipped=t.status==="done"||t.status==="documented";
        return `<div class="act"><div class="ad" style="background:${shipped?'var(--green)':'var(--dim)'}22;color:${shipped?'var(--green)':'var(--muted)'}"><i class="ti ti-${shipped?'check':'circle'}" style="font-size:13px"></i></div>
          <div class="atx"><span class="tk">${esc(t.id)}</span> ${esc(t.title)}</div><span class="tm">${esc(t.status)}</span></div>`;}).join("");
      document.getElementById("sprint-body").innerHTML=`
        <div class="kpis"><div class="kpi"><div class="ic"><i class="ti ti-flag"></i></div><div class="v">#${sp.number}</div><div class="k">${esc(sp.goal)}</div></div>
          <div class="kpi"><div class="ic"><i class="ti ti-checkbox"></i></div><div class="v">${done.length}/${total}</div><div class="k">committed shipped</div></div>
          <div class="kpi"><div class="ic"><i class="ti ti-percentage"></i></div><div class="v">${pct}%</div><div class="k">sprint progress</div></div></div>
        <div class="sec">Progress</div>
        <div class="panel"><div style="background:var(--card2);border-radius:8px;height:12px;overflow:hidden;margin-bottom:6px"><div style="width:${pct}%;height:100%;background:var(--accent2)"></div></div>
          <div style="color:var(--dim);font-size:11px">${done.length} of ${total} committed tickets shipped this sprint</div></div>
        <div class="sec">Committed tickets</div>
        <div class="panel">${rows||'<div class="empty">nothing committed</div>'}</div>
        ${velocityHtml(s.sprints||[])}`;
    }
  }else if(CUR==="insights"){
    const sp=s.spend||{by_role:{}};const tok=(sp.input_tokens||0)+(sp.output_tokens||0);
    document.getElementById("cost-kpis").innerHTML=[kpi("Total spend",money(sp.total_cost_usd)),kpi("Tokens",fmtK(tok)),kpi("Runs",sp.runs||0)].join("");
    const roles=Object.entries(sp.by_role||{}).sort((a,b)=>b[1]-a[1]);
    const max=roles.length?roles[0][1]:1;
    document.getElementById("cost-roles").innerHTML=roles.length?roles.map(([r,c])=>{
      const col=cvar(AC[r.toUpperCase().replace("_","-")]||"--accent2");const pct=Math.max(3,Math.round(c/max*100));
      return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0"><span style="min-width:110px;font-size:12px">${esc(r)}</span>
        <div style="flex:1;background:var(--card2);border-radius:6px;height:8px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${col}"></div></div>
        <span style="font-size:12px;font-family:ui-monospace,monospace;min-width:58px;text-align:right">${money(c)}</span></div>`;}).join(""):'<div class="empty">no spend yet — runs on scripted/mock cost $0</div>';
    const cap=(window._budget!==undefined)?window._budget:null;
    if(cap&&cap>0){const used=Math.min(100,Math.round((sp.total_cost_usd||0)/cap*100));
      document.getElementById("cost-budget").innerHTML=`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px"><span>${money(sp.total_cost_usd)} of ${money(cap)}</span><span style="color:var(--muted)">${used}%</span></div>
        <div style="background:var(--card2);border-radius:6px;height:10px;overflow:hidden"><div style="width:${used}%;height:100%;background:${used>=90?'var(--red)':used>=70?'var(--amber)':'var(--accent2)'}"></div></div>
        <div style="color:var(--dim);font-size:11px;margin-top:8px">Loop auto-pauses when the cap is reached.</div>`;
    }else{document.getElementById("cost-budget").innerHTML='<div class="empty">no budget cap set — add "budget_usd" in coxagent.json</div>';}
  }}
function render(s){STATE=s;renderSidebar(s);renderActive();}
function showTicket(id){const t=(STATE.tickets||[]).find(x=>x.id===id);if(!t)return;const d=t.design||{},tech=d.technical,ux=d.ux;
  let h=`<span class="x" onclick="close_('ov-ticket')"><i class="ti ti-x"></i></span><h3>${esc(t.title)}</h3>
    <div class="msub">${esc(t.id)} · ${esc(t.type)}</div>
    <div class="mrow"><span class="lbl">Status</span><b>${esc(t.status)}</b></div>
    <div class="mrow"><span class="lbl">Priority</span>${esc(t.priority)} · ${esc(t.complexity)}${t.has_ui?' · has UI':''}</div>
    <div class="mrow"><span class="lbl">Depends on</span>${(t.depends_on&&t.depends_on.length)?t.depends_on.map(esc).join(", "):'—'}</div>
    <div class="mrow" style="display:block"><span class="lbl">Description</span><div style="margin-top:7px;color:var(--muted);line-height:1.6">${esc(t.description)||'—'}</div></div>`;
  if(tech)h+=`<div class="mrow" style="display:block;border:none"><span class="lbl">Technical design</span><pre>${esc(tech.approach)}\nfiles: ${esc((tech.files||[]).join(", "))}\napi: ${esc(tech.api_contract)}\ntest: ${esc(tech.test_plan)}</pre></div>`;
  if(ux)h+=`<div class="mrow" style="display:block;border:none"><span class="lbl">UX design</span><pre>${esc(ux.user_flow)}\nscreens: ${esc((ux.screens||[]).join(", "))}</pre></div>`;
  document.getElementById("ticket-body").innerHTML=h;document.getElementById("ov-ticket").classList.add("open");}
async function loadSettings(){let cfg={};try{cfg=await(await fetch("/api/config")).json();}catch(e){}window._cfg=cfg;
  const def=cfg.engine&&cfg.engine.default||{engine:"claude",model:"sonnet"},per=cfg.engine&&cfg.engine.per_role||{},wf=cfg.workflow||{};
  const eng=["opencode","claude","scripted","mock"],opt=(s)=>eng.map(e=>`<option ${e===s?'selected':''}>${e}</option>`).join("");
  let rows=`<div class="fr"><span class="lbl">Default engine</span><select id="eng-default" onchange="onEngine('default')">${opt(def.engine)}</select>
    <span id="mc-default" style="flex:1;display:flex">${modelControl(def.engine,def.model,'default')}</span></div>`;
  rows+=ROLES.map(r=>{const c=per[r]||{};return `<div class="fr"><span class="lbl">${r}</span>
    <select id="eng-${r}" onchange="onEngine('${r}')"><option value="">(default)</option>${eng.map(e=>`<option ${c.engine===e?'selected':''}>${e}</option>`).join("")}</select>
    <span id="mc-${r}" style="flex:1;display:flex">${modelControl(c.engine||"",c.model||"",r)}</span></div>`;}).join("");
  document.getElementById("settings-body").innerHTML=`
    <div class="sec">Engines &amp; models</div>
    <div class="panel frm">${rows}</div>
    <div class="sec">Workflow</div>
    <div class="panel frm">
      <div class="fr"><span class="lbl">Mode</span><select id="wf-mode"><option value="kanban" ${wf.mode!=='scrum'?'selected':''}>kanban</option><option value="scrum" ${wf.mode==='scrum'?'selected':''}>scrum</option></select><span class="hint">scrum groups cycles into sprints</span></div>
      <div class="fr"><span class="lbl">Sprint length</span><input id="wf-sp" type="number" min="1" value="${wf.sprint_length_cycles??10}" style="width:90px"/><span class="hint">cycles per sprint</span></div>
      <div class="fr"><span class="lbl">BA every N cycles</span><input id="wf-ba" type="number" min="0" value="${wf.ba_every_n_cycles??4}" style="width:90px"/><span class="hint">0 disables BA</span></div>
      <div class="fr"><span class="lbl">Feature dev</span><select id="wf-fd"><option value="true" ${wf.feature_dev_enabled!==false?'selected':''}>enabled</option><option value="false" ${wf.feature_dev_enabled===false?'selected':''}>disabled</option></select></div>
      <div class="fr"><span class="lbl">Sleep seconds</span><input id="wf-sl" type="number" min="0" value="${wf.sleep_seconds??30}" style="width:90px"/><span class="hint">between cycles</span></div>
      <div class="fr"><span class="lbl">Budget (USD)</span><input id="wf-bg" type="number" min="0" step="0.5" value="${wf.budget_usd??''}" placeholder="none" style="width:90px"/><span class="hint">loop pauses at cap</span></div>
    </div>
    <button class="save" onclick="saveSettings()">Save changes</button>
    <span id="save-note" style="margin-left:12px;color:var(--muted);font-size:12px"></span>
    <div style="color:var(--dim);font-size:11px;margin-top:10px">Changes apply on the next serve restart.</div>`;}
async function saveSettings(){const cfg=window._cfg||{engine:{},workflow:{}};cfg.engine=cfg.engine||{};cfg.workflow=cfg.workflow||{};
  cfg.engine.default={engine:val("eng-default"),model:val("mdl-default")};
  const per={};ROLES.forEach(r=>{const e=val("eng-"+r),m=val("mdl-"+r);if(e)per[r]={engine:e,model:m||"sonnet"};});cfg.engine.per_role=per;
  cfg.workflow.mode=val("wf-mode");
  cfg.workflow.sprint_length_cycles=parseInt(val("wf-sp")||"10",10);
  cfg.workflow.ba_every_n_cycles=parseInt(val("wf-ba")||"4",10);
  cfg.workflow.feature_dev_enabled=val("wf-fd")==="true";
  cfg.workflow.sleep_seconds=parseInt(val("wf-sl")||"30",10);
  const bg=val("wf-bg");cfg.workflow.budget_usd=bg?parseFloat(bg):null;
  try{const res=await(await fetch("/api/config",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(cfg)})).json();
    document.getElementById("save-note").textContent=res.ok?"saved · restart to apply":"error";}catch(e){document.getElementById("save-note").textContent="error";}}
function val(id){return document.getElementById(id).value;}
function close_(id){document.getElementById(id).classList.remove("open");}
function setConn(on){document.getElementById("conn").className="dot "+(on?"live":"off");document.getElementById("connlbl").textContent=on?"live":"reconnecting";}
function renderRunner(r){if(!r)return;const c=r.mode==="running"?"live":(r.mode==="paused"?"paused":"off");
  document.getElementById("runmode").className="dot "+c;document.getElementById("runlbl").textContent=r.mode+" · cycle "+r.cycle;
  document.getElementById("runsum").textContent=r.last_summary||"idle";}
async function ctl(a){try{renderRunner(await(await fetch("/api/control/"+a,{method:"POST"})).json());}catch(e){}}
let poll=null;
function handle(m){if(m.state)render(m.state);renderRunner(m.runner);setConn(true);}
function startPoll(){if(poll)return;poll=setInterval(async()=>{try{const s=await(await fetch("/api/state")).json();const rn=await(await fetch("/api/runner")).json();render(s);renderRunner(rn);setConn(false);}catch(e){}},3000);}
function connect(){const es=new EventSource("/api/events");es.onmessage=e=>{try{handle(JSON.parse(e.data));if(poll){clearInterval(poll);poll=null;}}catch(_){}};es.onerror=()=>{setConn(false);startPoll();};}
fetch("/api/config").then(r=>r.json()).then(c=>{window._budget=(c.workflow&&c.workflow.budget_usd)||null;if(CUR==="insights")renderActive();}).catch(()=>{});
const h=(location.hash||"").slice(1);if(TITLES[h])nav(h);else nav("overview");
connect();
</script>
</body>
</html>
