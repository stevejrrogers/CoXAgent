[package]
name = "coxagent-presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Propagate the infra `harxes` gate (private harxes-core dep) so an external
# build can turn it off end to end with --no-default-features. Default-on →
# live build unchanged.
default = ["harxes"]
harxes = ["coxagent-infrastructure/harxes"]

[dependencies]
coxagent-infrastructure = { path = "../infrastructure", default-features = false }
redis = { workspace = true }
coxagent-contracts = { path = "../contracts" }
coxagent-domain.workspace = true
coxagent-application.workspace = true
async-trait.workspace = true
hmac.workspace = true
sha1.workspace = true
clap.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true
portable-pty = "0.9.0"
futures-util = "0.3.33"
tower-http = { workspace = true }
reqwest.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
