[package]
name = "coxagent-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "coxagent"
path = "src/main.rs"

[[bin]]
name = "cox-all"
path = "src/bin/service.rs"



[features]
# Propagate the harxes gate (private harxes-core dep) across the whole app so
# an external operator can build with --no-default-features (no deploy key).
# Default-on → the live build and CI are unchanged.
default = ["harxes"]
harxes = ["coxagent-infrastructure/harxes", "coxagent-presentation/harxes"]

[dependencies]
coxagent-domain.workspace = true
coxagent-application.workspace = true
coxagent-infrastructure.workspace = true
coxagent-presentation.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tempfile.workspace = true

[dev-dependencies]
reqwest.workspace = true
async-trait.workspace = true
time.workspace = true

[lints]
workspace = true
