[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/contracts",
    "crates/application",
    "crates/infrastructure",
    "crates/presentation",
    "crates/app",
    "crates/services/gateway",
    "crates/services/runner",
    "crates/services/realtime",
    "crates/services/knowledge",
]
# The desktop shell pulls heavy GUI deps (tao/wry) and is built separately.
exclude = ["desktop/coxagent-desktop"]

[workspace.package]
version = "2.26.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/org/coxagent"

[workspace.dependencies]
# Internal crates
coxagent-domain = { path = "crates/domain" }
coxagent-application = { path = "crates/application" }
coxagent-infrastructure = { path = "crates/infrastructure" }
coxagent-presentation = { path = "crates/presentation" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "process", "io-util", "signal", "net"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
semver = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
fs4 = { version = "0.13", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio-stream = "0.1"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
redis = { version = "0.27", features = ["tokio-comp"] }
mongodb = "=3.2.3"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-go = "0.21"
tree-sitter-java = "0.21"
tree-sitter-c-sharp = "0.21"
tree-sitter-swift = "0.5"
tree-sitter-c = "0.21"
tree-sitter-cpp = "0.22"
tree-sitter-ruby = "0.21"
tree-sitter-php = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
# "CoXAgent" is a CamelCase product name that appears throughout doc comments;
# doc_markdown would flag every mention as a missing-backtick code item.
doc_markdown = "allow"
